  <rect x="58" y="64" width="84" height="50" rx="9" fill="#BFDBFE"/>
  <!-- Cam parlaması -->
  <rect x="64" y="70" width="28" height="16" rx="5" fill="white" opacity="0.25"/>

  <!-- Kalp (cam içinde) -->
