  <!-- Kalp parlama -->
  <ellipse cx="90" cy="77" rx="4" ry="3" fill="white" opacity="0.35" transform="rotate(-30 90 77)"/>

  <!-- Sol far -->
  <circle cx="60" cy="143" r="15" fill="#FEF08A"/>
  <circle cx="60" cy="143" r="10" fill="#FDE047"/>
  <circle cx="55" cy="138" r="3.5" fill="white" opacity="0.55"/>

  <!-- Sağ far -->
