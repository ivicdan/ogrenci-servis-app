<svg viewBox="0 0 200 200" width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Arka plan -->
  <rect width="200" height="200" rx="44" fill="#1D4ED8"/>

  <!-- Otobüs çatısı (yuvarlak üst) -->
