  <line x1="89" y1="136" x2="111" y2="136" stroke="#F97316" stroke-width="2" stroke-linecap="round"/>
  <line x1="89" y1="142" x2="111" y2="142" stroke="#F97316" stroke-width="2" stroke-linecap="round"/>
  <line x1="89" y1="148" x2="111" y2="148" stroke="#F97316" stroke-width="2" stroke-linecap="round"/>

